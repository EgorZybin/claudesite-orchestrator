[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claudesite-orchestrator"
version = "0.1.0"
description = "Orchestrator for Claude-driven site generation (FastAPI + Celery)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "typer>=0.9",
  "pydantic-settings>=2.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "cryptography>=42.0",
  "celery[redis]>=5.3",
  "redis>=5.0",
  "pyyaml>=6.0",
  "httpx>=0.26",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
  "pillow>=10.0",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
claudesite = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
